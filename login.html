<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión - TLAP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <span class="brand">Tennessee Leaders Action Platform</span>
</header>

<main>
  <h1 class="page-title">Bienvenido</h1>
  <p class="page-subtitle">Crea una cuenta o inicia sesión para entrar al sitio.</p>

  <div class="auth-wrap">
    <div class="auth-tabs">
      <button type="button" id="tabLogin">Iniciar sesión</button>
      <button type="button" id="tabSignup">Crear cuenta</button>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Correo</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="field">
        <label for="loginPassword">Clave</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button class="btn" type="submit" style="width:100%;">Entrar</button>
    </form>

    <form id="signupForm" style="display:none;">
      <div class="field">
        <label for="signupName">Nombre</label>
        <input type="text" id="signupName" required>
      </div>
      <div class="field">
        <label for="signupEmail">Correo</label>
        <input type="email" id="signupEmail" required>
      </div>
      <div class="field">
        <label for="signupPassword">Clave</label>
        <input type="password" id="signupPassword" minlength="6" required>
      </div>
      <button class="btn" type="submit" style="width:100%;">Crear cuenta</button>
    </form>

    <div class="error-msg" id="authError"></div>
  </div>
</main>

<script type="module" src="js/login-auth.js"></script>
</body>
</html>
